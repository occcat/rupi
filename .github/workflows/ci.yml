name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  ci:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Assessment cited 1.85 (edition2024 floor). Current Cargo.lock needs
        # 1.88 (darling / encoding_rs / icu_* / ignore / globset).
        toolchain: [stable, "1.88"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install OpenSSL headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      # Current tree is not rustfmt-clean. Keep the check visible on every
      # matrix cell, but do not gate CI — a full rustfmt would collide with
      # sibling bash/TUI PRs. Make this required after those land.
      - name: rustfmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked --exclude rupi-benches

      - name: build
        run: cargo build --workspace --all-targets --locked --exclude rupi-benches

      - name: test
        run: cargo test --workspace --locked --exclude rupi-benches

  bench:
    name: benches (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build criterion benches
        run: cargo bench --workspace --no-run --locked

  supply-chain:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      # Advisories 走 cargo-audit：部分 rustsec 条目已用 CVSS 4.0，
      # 旧 cargo-deny 解析 advisory-db 会直接失败。
      - name: cargo deny check
        run: cargo deny check licenses bans sources

      - name: cargo audit
        run: cargo audit
