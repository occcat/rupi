name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ten_thousand_streams:
        description: Run ignored 10k-entry short streams (never on pull_request)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  ci:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Assessment cited 1.85 (edition2024 floor). Current Cargo.lock needs
        # 1.88 (darling / encoding_rs / icu_* / ignore / globset).
        toolchain: [stable, "1.88"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install OpenSSL headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked --exclude rupi-benches

      - name: build
        run: cargo build --workspace --all-targets --locked --exclude rupi-benches

      - name: test
        run: cargo test --workspace --locked --exclude rupi-benches

  cloud:
    name: cloud control plane
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rupi
          POSTGRES_PASSWORD: rupi
          POSTGRES_DB: rupi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rupi -d rupi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://rupi:rupi@127.0.0.1:5432/rupi
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: MinIO (S3 compatible, optional)
        continue-on-error: true
        run: |
          # 社区版不再保证预编译二进制；失败则跳过，s3_compat 进程内服务仍跑。
          url="https://dl.min.io/server/minio/release/linux-amd64/archive/minio.RELEASE.2025-09-07T16-13-09Z"
          if ! curl -fL --retry 2 -o /tmp/minio "$url"; then
            echo "minio binary unavailable; S3 tests use in-process compat server"
            exit 0
          fi
          chmod +x /tmp/minio
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=rupi MINIO_ROOT_PASSWORD=rupisecret1 \
            /tmp/minio server /tmp/minio-data --address 127.0.0.1:9000 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "RUPI_S3_ENDPOINT=http://127.0.0.1:9000" >> "$GITHUB_ENV"
              echo "RUPI_S3_ACCESS_KEY=rupi" >> "$GITHUB_ENV"
              echo "RUPI_S3_SECRET_KEY=rupisecret1" >> "$GITHUB_ENV"
              echo "RUPI_S3_REGION=us-east-1" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.25
          done
          echo "minio did not become healthy; continuing without it"

      # cloud_chaos 的 ten_thousand_streams 是 #[ignore]：这里只跑缩小规模的
      # 池耗尽 / 杀副本 / short_stream_load_regression，不会打满一万长连接。
      - name: cloud crates
        run: cargo test --locked -p rupi-runtime -p rupi-server -p rupi-agent -- --nocapture

      - name: ten thousand streams (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ten_thousand_streams }}
        run: cargo test --locked -p rupi-server --test cloud_chaos ten_thousand_streams -- --ignored --exact --nocapture

      - name: local rpc regression
        run: cargo test --locked -p rupi-cli --test smoke rpc_mode_prompt_and_state -- --exact

      - name: thin cloud client
        run: cargo test --locked -p rupi-cli --test cloud_thin -- --nocapture

  bench:
    name: benches (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build criterion benches
        run: cargo bench --workspace --no-run --locked

  supply-chain:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      # Advisories 走 cargo-audit：部分 rustsec 条目已用 CVSS 4.0，
      # 旧 cargo-deny 解析 advisory-db 会直接失败。
      - name: cargo deny check
        run: cargo deny check licenses bans sources

      - name: cargo audit
        run: cargo audit
