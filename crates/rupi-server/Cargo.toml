[package]
name = "rupi-server"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Stateless cloud control plane (AG-UI + REST). Does not link rupi-tui."

[[bin]]
name = "rupi-server"
path = "src/main.rs"

[[bin]]
name = "rupi-execd"
path = "src/bin/rupi-execd.rs"

[[bin]]
name = "rupi-sandboxd"
path = "src/bin/rupi-sandboxd.rs"

[dependencies]
rupi-core = { path = "../rupi-core" }
rupi-llm = { path = "../rupi-llm" }
rupi-tools = { path = "../rupi-tools" }
rupi-agent = { path = "../rupi-agent" }
rupi-memory = { path = "../rupi-memory" }
rupi-skills = { path = "../rupi-skills" }
rupi-runtime = { path = "../rupi-runtime" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["env"] }
reqwest = { workspace = true }
futures = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower-http = { version = "0.6", features = ["trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1", "with-chrono-0_4"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "aio"] }
sha2 = "0.10"
hex = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "stream"] }
walkdir = { workspace = true }
