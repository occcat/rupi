[package]
name = "rupi-benches"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Criterion benches: SSE parse, edit, compaction, SessionStore"

[dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
rupi-agent = { path = "../rupi-agent" }
rupi-core = { path = "../rupi-core" }
rupi-llm = { path = "../rupi-llm" }
rupi-memory = { path = "../rupi-memory" }
rupi-tools = { path = "../rupi-tools" }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[[bench]]
name = "sse"
harness = false

[[bench]]
name = "edit"
harness = false

[[bench]]
name = "compaction"
harness = false

[[bench]]
name = "session_store"
harness = false
