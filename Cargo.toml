[workspace]
resolver = "2"
members = [
    "crates/rupi-ai",
    "crates/rupi-agent-core",
    "crates/rupi-mcp",
    "crates/rupi-memory",
    "crates/rupi-skills",
    "crates/rupi-coding-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["rupi"]
description = "Rust recreation of Pi coding agent (earendil-works/pi 0.85.1) with MCP, Hermes-style memory, and skill self-accumulation"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1.83"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "=4.5.23", features = ["derive", "env"] }
futures = "0.3.31"
regex = "1.11.1"
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
serde_yaml = "0.9.34"
similar = "=2.6.0"
tempfile = "3.14.0"
thiserror = "1.0.69"
tokio = { version = "=1.43.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "=1.11.0", features = ["v4", "v7", "serde"] }
walkdir = "2.5.0"
ignore = "=0.4.23"
toml = "0.8.19"
anyhow = "1.0.94"
bytes = "1.8.0"
indexmap = { version = "=2.6.0", features = ["serde"] }
url = "2.5.4"
base64 = "0.22.1"
once_cell = "1.20.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
