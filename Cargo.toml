[workspace]
members = [
  "crates/rupi-core",
  "crates/rupi-config",
  "crates/rupi-llm",
  "crates/rupi-tools",
  "crates/rupi-agent",
  "crates/rupi-mcp",
  "crates/rupi-memory",
  "crates/rupi-skills",
  "crates/rupi-ext",
  "crates/rupi-tui",
  "crates/rupi-cli",
  "crates/rupi-pkg",
  "crates/rupi-benches",
  "crates/rupi-runtime",
  "crates/rupi-server",
]
resolver = "2"

[workspace.package]
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
# rustls + Mozilla roots：去掉 OpenSSL；Client 初始化不再扫系统 CA；可 musl 静态链接。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "charset", "rustls-tls-webpki-roots"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_yaml = "0.9"
futures = "0.3"
walkdir = "2"
glob = "0.3"
ignore = "0.4"
libc = "0.2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
similar = "2"
