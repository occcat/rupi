[workspace]
resolver = "2"
members = [
    "crates/rupi-ai",
    "crates/rupi-agent",
    "crates/rupi-mcp",
    "crates/rupi-memory",
    "crates/rupi-skills",
    "crates/rupi-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/occcat/rupi"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.9"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
futures = "0.3"
ignore = "0.4"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
similar = "2.6"
tempfile = "3.14"
thiserror = "1.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time", "fs", "signal"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
